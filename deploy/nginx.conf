server {
    listen 80;
    server_name xiaozhanan.xyz www.xiaozhanan.xyz;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name xiaozhanan.xyz www.xiaozhanan.xyz;

    root /var/www/backend/public;
    index index.php;

    # Let's Encrypt 证书
    ssl_certificate     /etc/letsencrypt/live/xiaozhanan.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/xiaozhanan.xyz/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # 安全头
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'; frame-ancestors 'self';" always;

    # 敏感文件拒绝
    location ~ /\.(?!well-known).* {
        deny all;
    }

    location ~ /storage/logs/ {
        deny all;
    }

    location ~ /\.(env|json|lock|md|gitignore|gitattributes|log|sql|tar|gz|zip)$ {
        deny all;
    }

    # 存储文件（上传的图片等）
    location /storage/ {
        alias /var/www/backend/storage/app/public/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        # 按实际 PHP 版本调整 socket 路径（如 php8.0-fpm.sock、php7.4-fpm.sock）
        fastcgi_pass unix:/var/run/php/php-fpm.sock;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_param HTTPS on;
    }

    # 静态资源缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        log_not_found off;
        access_log off;
    }

    access_log /var/log/nginx/xiaozhanan.xyz-access.log;
    error_log  /var/log/nginx/xiaozhanan.xyz-error.log;
}
